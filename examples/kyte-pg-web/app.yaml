# The sandwich shop, deployed as N single-thread replicas behind the orchestrator
# gateway in fd-handoff mode. Handoff is required: a buffering L7 proxy cannot
# carry the long-lived SSE order-status stream, whereas after fd-handoff the
# replica owns the client socket directly. See DESIGN.md section 15.
apiVersion: kyte/v1
kind: App
metadata:
  name: shop
workload:
  binary: ./build/shop
  restartPolicy: always
replicas:
  # Multiple replicas with live order-status (SSE) intact: status changes are
  # broadcast over Postgres LISTEN/NOTIFY, so an advance on any replica reaches a
  # viewer connected to any other replica.
  min: 2
  max: 4
lb:
  strategy: roundrobin
  handoff: true
health:
  path: /products
  intervalMs: 2000
  timeoutMs: 1000
  rise: 1
  fall: 3
network:
  expose: gateway-only
resources:
  cpuMilli: 500
  memMaxBytes: 268435456
  pidsMax: 128
# Application configuration: typed sections the app binds via the framework loader (web.config), read
# straight from THIS file, never from environment variables. Each section maps to an app-defined
# @serializable struct (src/Shared/AppConfig.ky): db -> DbConfig, payment -> PaymentConfig, etc.
# SECRETS (payment.apiKey, oauth.googleClientSecret): leave empty here, never commit them; the operator
# fills them into the delivered manifest in the orchestrator so they reach the app through this same file.
config:
  db:
    dsn: postgresql://kamlesh@127.0.0.1:5432/sandwichshop
    poolSize: 32
  payment:
    provider: stripe
    apiKey: ""
  oauth:
    googleClientId: ""
    googleClientSecret: ""
